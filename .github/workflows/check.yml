name: Check calculations and build paper

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install scientific Python dependencies
        run: python -m pip install -r requirements.lock
      - name: Verify calculations and regenerate figures
        run: make PYTHON=python check results
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended lmodern
      - name: Compile paper
        run: |
          mkdir -p build output/pdf
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=../build main.tex
          cd ..
          cp build/main.pdf output/pdf/geometry-of-spacetime-v0.5.pdf
      - name: Upload paper and numerical results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geometry-of-spacetime-v0.5
          path: |
            output/pdf/*.pdf
            results/
          if-no-files-found: error
